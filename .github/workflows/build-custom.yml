name: Verify miner backend and bundled dashboard

on:
  workflow_dispatch:
  push:
    paths:
      - 'custom_components/miner/**'
      - 'dashboard/**'
      - 'UPSTREAM_BASELINE.json'
      - '.github/workflows/build-custom.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original miner backend is unchanged
        run: |
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          record = json.loads(Path("UPSTREAM_BASELINE.json").read_text())
          baseline = record["technical_files"]
          known_modules = set(baseline)
          actual_modules = {str(p) for p in Path("custom_components/miner").rglob("*.py")}
          assert actual_modules == known_modules | {"custom_components/miner/dashboard_resource.py"}, (
              sorted(actual_modules - known_modules), sorted(known_modules - actual_modules)
          )
          for path, sha in baseline.items():
              if path.endswith("/__init__.py"):
                  raw = Path(path).read_bytes()
                  marker = b"\n\n# --- D.H. DASHBOARD REGISTRATION (cosmetic, isolated from mining) ---"
                  assert raw.count(marker) == 1, "Unexpected backend entry point edits"
                  original = raw.split(marker)[0]
                  h = hashlib.sha1(b"blob " + str(len(original)).encode() + b"\0" + original).hexdigest()
              else:
                  h = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              assert h == sha, f"Upstream miner backend modified: {path}"

          from pathlib import Path
          manifest = json.loads(Path("custom_components/miner/manifest.json").read_text())
          assert manifest["version"] == "1.0.0-beta.5"
          assert manifest["requirements"] == ["betterproto==2.0.0b7", "grpcio>=1.60.0", "pyasic>=0.78.0"]
          assert set(manifest["dependencies"]) == {"network", "http", "frontend"}
          for name in ("strings.json","translations/en.json","translations/de.json"):
              json.loads((Path("custom_components/miner")/name).read_text())
          import struct, zlib
          def check_png(path):
              raw = Path(path).read_bytes()
              assert raw.startswith(b"\x89PNG\r\n\x1a\n"), "Invalid PNG signature"
              offset = 8
              saw_end = False
              while offset < len(raw):
                  assert offset + 12 <= len(raw), "Truncated PNG chunk header"
                  length = struct.unpack_from(">I", raw, offset)[0]
                  assert offset + 12 + length <= len(raw), "Truncated PNG chunk data"
                  marker = raw[offset + 4:offset + 8]
                  crc_expected = struct.unpack_from(">I", raw, offset + 8 + length)[0]
                  assert zlib.crc32(raw[offset + 4:offset + 8 + length]) == crc_expected, "Invalid PNG CRC"
                  offset += 12 + length
                  if marker == b"IEND":
                      saw_end = True
                      break
              assert saw_end and offset == len(raw), "PNG missing IEND chunk"
          for path in (
              "custom_components/miner/frontend/satoshi.png",
              "custom_components/miner/brand/logo.png",
          ):
              check_png(path)
          assert Path("custom_components/miner/frontend/dh-miner-card.js").read_bytes() == Path("dashboard/dh-miner-card.js").read_bytes()
          print("Original miner backend preserved; dashboard is isolated.")
          PY
      - name: Check code syntax
        run: |
          python -m compileall -q custom_components/miner
          node --check custom_components/miner/frontend/dh-miner-card.js
          node --check dashboard/dh-miner-card.js

name: Validate customized Miner-Steuerung

on:
  workflow_dispatch:
  push:
    paths:
      - 'custom_components/miner/**'
      - '.github/workflows/build-custom.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      - name: Validate Python syntax
        run: python -m compileall -q custom_components/miner
      - name: Validate manifest and version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("custom_components/miner/manifest.json").read_text())
          assert manifest["domain"] == "miner"
          assert manifest["version"] == "1.0.0-beta.3"
          assert "pyasic==0.78.12" in manifest["requirements"]
          print("Manifest and syntax validation passed")
          PY
